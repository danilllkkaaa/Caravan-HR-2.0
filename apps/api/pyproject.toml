[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caravan-hr-api"
version = "2.0.0"
description = "Caravan HR Portal Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.2,<5.0.0",
    "httpx>=0.27.0",
    "celery[redis]>=5.3.6,<5.5.0",
    "redis[hiredis]>=5.0.3,<6.0.0",
    "minio>=7.2.5",
    "structlog>=24.1.0",
    "sentry-sdk[fastapi]>=1.44.1",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.1",
    "greenlet>=3.0.3",
    "orjson>=3.10.0",
    "sqladmin>=0.16.1",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=24.9.0",
    "anyio>=4.3.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "types-passlib>=1.7.7.20240819",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/workers/*.py" = ["B007", "B904", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = []
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
exclude = ["app/workers/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
