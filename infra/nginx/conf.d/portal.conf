# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN} www.${DOMAIN};

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${DOMAIN};

    # SSL certificate (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/${DOMAIN}/chain.pem;

    # ── Security headers ─────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; "
        "script-src 'self' 'unsafe-inline' 'unsafe-eval'; "
        "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; "
        "font-src 'self' https://fonts.gstatic.com; "
        "img-src 'self' data: blob: https:; "
        "connect-src 'self' wss:; "
        "frame-ancestors 'none'; "
        "base-uri 'self'; "
        "form-action 'self';"
        always;

    # ── Connection limits ─────────────────────────────────────
    limit_conn conn_limit 50;
    limit_req zone=global_limit burst=50 nodelay;

    root /var/www/web;
    index index.html;

    # ── API routes ────────────────────────────────────────────

    # Auth endpoints — stricter rate limiting
    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # General API — standard rate limiting
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # S3 presigned URLs through the public portal host.
    # Keep Host unchanged because S3 signatures include it.
    location ~ ^/(sick-leave-documents|personal-data-documents)/ {
        client_max_body_size 25m;
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # Admin UI (FastAPI admin) — restrict by IP or auth
    location /admin/ui {
        limit_req zone=api_limit burst=10 nodelay;

        # Optional: restrict to internal IPs
        # allow 10.0.0.0/8;
        # deny all;

        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # OpenAPI docs (restrict in production)
    location ~ ^/(docs|redoc|openapi\.json)$ {
        # allow 10.0.0.0/8;
        # deny all;
        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Metrics endpoint (internal only)
    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── Grafana (monitoring) ──────────────────────────────────
    location /grafana/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://grafana_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── PWA service worker — no cache ────────────────────────
    location ~* (sw\.js|workbox-.+\.js)$ {
        root /var/www/web;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
        try_files $uri =404;
    }

    # ── Next.js static assets — aggressive caching ───────────
    location /_next/static/ {
        root /var/www/web;
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip_static on;
        try_files $uri =404;
    }

    # ── Public files ──────────────────────────────────────────
    location /icons/ {
        root /var/www/web;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /manifest.json {
        root /var/www/web;
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Type "application/manifest+json";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /api/\nDisallow: /admin/\n";
    }

    # ── Next.js frontend — SPA fallback ──────────────────────
    location / {
        root /var/www/web;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "DENY";
    }

    # ── Error pages ───────────────────────────────────────────
    error_page 429 /429.json;
    location = /429.json {
        internal;
        add_header Content-Type application/json;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Слишком много запросов. Попробуйте позже."}}';
    }

    error_page 502 503 504 /50x.json;
    location = /50x.json {
        internal;
        add_header Content-Type application/json;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Сервис временно недоступен."}}';
    }
}

# www redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.${DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    return 301 https://${DOMAIN}$request_uri;
}
