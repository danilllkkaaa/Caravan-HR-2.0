server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    absolute_redirect off;

    root /var/www/web;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' http: https: ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    limit_conn conn_limit 50;
    limit_req zone=global_limit burst=100 nodelay;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /admin/ui {
        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location ~ ^/(sick-leave-documents|personal-data-documents)/ {
        client_max_body_size 25m;
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* /(sw\.js|swe-worker-.+\.js|workbox-.+\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
        try_files $uri =404;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Type "application/manifest+json";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /api/\nDisallow: /admin/\n";
    }

    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    error_page 429 /429.json;
    location = /429.json {
        internal;
        add_header Content-Type application/json;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Try again later."}}';
    }

    error_page 502 503 504 /50x.json;
    location = /50x.json {
        internal;
        add_header Content-Type application/json;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Service temporarily unavailable."}}';
    }
}
