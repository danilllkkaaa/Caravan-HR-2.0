x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: portal-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
      - web_static:/var/www/web:ro
    depends_on:
      - api
    logging: *default-logging
    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    image: ${REGISTRY:-ghcr.io/company}/portal-api:${API_IMAGE_TAG:-latest}
    container_name: portal-api
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS}
      DATABASE_URL: postgresql+asyncpg://portal:${POSTGRES_PASSWORD}@postgres:5432/portal
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 30
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_SICK_LEAVE: ${MINIO_BUCKET_SICK_LEAVE:-sick-leave-documents}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
    expose:
      - '8000'
    volumes:
      - api_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-worker:
    image: ${REGISTRY:-ghcr.io/company}/portal-api:${API_IMAGE_TAG:-latest}
    container_name: portal-celery-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app worker -l INFO -Q default,sync,attendance,notifications --concurrency=4
    environment:
      DATABASE_URL: postgresql+asyncpg://portal:${POSTGRES_PASSWORD}@postgres:5432/portal
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
    depends_on:
      - api
      - redis
    logging: *default-logging

  celery-beat:
    image: ${REGISTRY:-ghcr.io/company}/portal-api:${API_IMAGE_TAG:-latest}
    container_name: portal-celery-beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app beat -l INFO --scheduler celery.beat:PersistentScheduler
    environment:
      DATABASE_URL: postgresql+asyncpg://portal:${POSTGRES_PASSWORD}@postgres:5432/portal
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
    volumes:
      - celery_beat_data:/var/run/celery
    depends_on:
      - api
      - redis
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    container_name: portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - '5432'
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portal -d portal']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: portal-redis
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --save 300 10
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    expose:
      - '6379'
    volumes:
      - redis_data:/data
    logging: *default-logging
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  minio:
    image: minio/minio:latest
    container_name: portal-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ':9001'
    expose:
      - '9000'
      - '9001'
    volumes:
      - minio_data:/data
    logging: *default-logging
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: portal-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - '9090'
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    container_name: portal-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana:/etc/grafana/provisioning:ro
    expose:
      - '3000'
    depends_on:
      - prometheus
    logging: *default-logging

  loki:
    image: grafana/loki:latest
    container_name: portal-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    expose:
      - '3100'
    logging: *default-logging

volumes:
  postgres_data:
    name: portal_prod_postgres_data
  redis_data:
    name: portal_prod_redis_data
  minio_data:
    name: portal_prod_minio_data
  prometheus_data:
    name: portal_prod_prometheus_data
  grafana_data:
    name: portal_prod_grafana_data
  loki_data:
    name: portal_prod_loki_data
  api_logs:
    name: portal_prod_api_logs
  celery_beat_data:
    name: portal_prod_celery_beat_data
  certbot_webroot:
    name: portal_certbot_webroot
  web_static:
    name: portal_web_static

networks:
  default:
    name: portal-prod-network
    driver: bridge
