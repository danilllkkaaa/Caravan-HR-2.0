name: caravan-hr

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-build: &api-build
  context: ../../apps/api
  dockerfile: Dockerfile

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  APP_SECRET_KEY: ${APP_SECRET_KEY:-caravan-hr-local-secret}
  APP_ALLOWED_ORIGINS: "${APP_ALLOWED_ORIGINS:-http://localhost:3100,http://127.0.0.1:3100}"
  DATABASE_URL: postgresql+asyncpg://portal:${POSTGRES_PASSWORD:-portal_password}@postgres:5432/portal
  REDIS_URL: redis://:${REDIS_PASSWORD:-portal_redis_password}@redis:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-caravan-hr-local-jwt-secret}
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-30}
  FERNET_KEY: ${FERNET_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  MINIO_ENDPOINT: minio:9000
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:3100}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
  MINIO_REGION: ${MINIO_REGION:-us-east-1}
  MINIO_BUCKET_SICK_LEAVE: ${MINIO_BUCKET_SICK_LEAVE:-sick-leave-documents}
  MINIO_BUCKET_PERSONAL_DATA: ${MINIO_BUCKET_PERSONAL_DATA:-personal-data-documents}
  MINIO_SECURE: "false"
  MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE:-false}
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-portal_redis_password}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-portal_redis_password}@redis:6379/2

services:
  nginx:
    build:
      context: ../..
      dockerfile: infra/docker/nginx.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3100}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3100}
    image: caravan-hr-web:local
    container_name: caravan-hr-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-3100}:80"
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    build: *api-build
    image: caravan-hr-api:local
    container_name: caravan-hr-api
    restart: unless-stopped
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    volumes:
      - api_logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  migrate:
    build: *api-build
    image: caravan-hr-api:local
    container_name: caravan-hr-migrate
    restart: "no"
    command: alembic upgrade head
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  seed-demo:
    build: *api-build
    image: caravan-hr-api:local
    container_name: caravan-hr-seed-demo
    restart: "no"
    command: python -m app.seed_demo
    profiles:
      - seed
    environment:
      <<: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging

  celery-worker:
    build: *api-build
    image: caravan-hr-api:local
    container_name: caravan-hr-celery-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app worker -l INFO --concurrency=${CELERY_CONCURRENCY:-2}
    environment:
      <<: *api-env
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  celery-beat:
    build: *api-build
    image: caravan-hr-api:local
    container_name: caravan-hr-celery-beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app beat -l INFO --scheduler celery.beat:PersistentScheduler
    environment:
      <<: *api-env
    volumes:
      - celery_beat_data:/var/run/celery
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    container_name: caravan-hr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: caravan-hr-redis
    restart: unless-stopped
    command:
      - sh
      - -c
      - >
        redis-server
        --save 60 1
        --save 300 10
        --appendonly yes
        --appendfsync everysec
        --maxmemory ${REDIS_MAXMEMORY:-256mb}
        --maxmemory-policy allkeys-lru
        --requirepass "$${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-portal_redis_password}
    volumes:
      - redis_data:/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: caravan-hr-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: caravan-hr-minio-init
    restart: on-failure
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET_SICK_LEAVE: ${MINIO_BUCKET_SICK_LEAVE:-sick-leave-documents}
      MINIO_BUCKET_PERSONAL_DATA: ${MINIO_BUCKET_PERSONAL_DATA:-personal-data-documents}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET_SICK_LEAVE}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET_PERSONAL_DATA}" &&
        echo "MinIO buckets ready"
    depends_on:
      minio:
        condition: service_healthy
    logging: *default-logging

  adminer:
    image: adminer:latest
    container_name: caravan-hr-adminer
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

volumes:
  postgres_data:
    name: caravan_hr_postgres_data
  redis_data:
    name: caravan_hr_redis_data
  minio_data:
    name: caravan_hr_minio_data
  api_logs:
    name: caravan_hr_api_logs
  celery_beat_data:
    name: caravan_hr_celery_beat_data

networks:
  default:
    name: caravan-hr-network
    driver: bridge
