global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    project: 'corp-portal'

# Alerting rules
rule_files:
  - 'alerts/*.yml'

# Alertmanager (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  # FastAPI application metrics
  - job_name: 'api'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'api'
          version: 'latest'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # PostgreSQL exporter
  - job_name: 'postgres'
    scrape_interval: 30s
    static_configs:
      - targets: ['postgres_exporter:9187']
        labels:
          service: 'postgres'
          database: 'portal'

  # Redis exporter
  - job_name: 'redis'
    scrape_interval: 15s
    static_configs:
      - targets: ['redis_exporter:9121']
        labels:
          service: 'redis'

  # Node exporter (host metrics)
  - job_name: 'node'
    scrape_interval: 15s
    static_configs:
      - targets: ['node_exporter:9100']
        labels:
          service: 'node'

  # Nginx exporter (if installed)
  # - job_name: 'nginx'
  #   static_configs:
  #     - targets: ['nginx_exporter:9113']

  # Celery flower (if installed)
  # - job_name: 'celery'
  #   static_configs:
  #     - targets: ['flower:5555']
  #   metrics_path: /metrics

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'

  # Loki
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: 'loki'
    metrics_path: /metrics
